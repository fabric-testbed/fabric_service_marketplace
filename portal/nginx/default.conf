# The portal's site in Docker (docker-compose.yml): same routes as nginx/portal.conf,
# with the app and vouch-proxy reached by their container names.

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/ssl/public.pem;
    ssl_certificate_key /etc/ssl/private.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker's name service. The other containers are looked up while serving
    # (the names are in variables), not once at start-up. So Nginx keeps working
    # when the portal container is rebuilt and gets a new address
    # (`docker compose up -d --build`), and starts while vouch-proxy is stopped.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $portal http://portal:5000;
    set $vouch http://vouch-proxy:9090;

    # "Sign in with FABRIC": vouch-proxy, the same login as the Credential Manager.
    # CILogon returns the browser to /auth (vouch's callback_url). Exact match, so
    # the portal's own /auth/... pages are not affected.
    location = /auth {
        proxy_pass $vouch;
        proxy_set_header Host $http_host;
    }
    # Start of the login. The portal adds ?url=<where to return afterwards>.
    location = /vouch/login {
        proxy_pass $vouch/login$is_args$args;
        proxy_set_header Host $http_host;
    }
    # End the FABRIC sign-in (clears the login cookie), then back to the portal
    location = /vouch/logout {
        proxy_pass $vouch/logout$is_args$args;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass $portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
