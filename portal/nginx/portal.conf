# Catch-all: redirect IP access or unknown hosts to the domain
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate     PLACEHOLDER_CRT;
    ssl_certificate_key PLACEHOLDER_KEY;
    return 301 https://PLACEHOLDER_SERVER_NAME$request_uri;
}

# HTTP → HTTPS redirect for the domain
server {
    listen 80;
    server_name PLACEHOLDER_SERVER_NAME;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name PLACEHOLDER_SERVER_NAME;

    ssl_certificate     PLACEHOLDER_CRT;
    ssl_certificate_key PLACEHOLDER_KEY;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
