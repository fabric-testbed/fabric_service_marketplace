# Catch-all: redirect IP access or unknown hosts to the domain
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate     PLACEHOLDER_CRT;
    ssl_certificate_key PLACEHOLDER_KEY;
    # Read before the server name is known, so it is needed here too (see below)
    large_client_header_buffers 4 32k;
    return 301 https://PLACEHOLDER_SERVER_NAME$request_uri;
}

# HTTP → HTTPS redirect for the domain
server {
    listen 80;
    server_name PLACEHOLDER_SERVER_NAME;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name PLACEHOLDER_SERVER_NAME;

    ssl_certificate     PLACEHOLDER_CRT;
    ssl_certificate_key PLACEHOLDER_KEY;

    # The FABRIC login cookie holds CILogon tokens and is larger than the defaults allow
    large_client_header_buffers 4 32k;
    proxy_buffer_size 32k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 32k;

    # "Sign in with FABRIC": vouch-proxy (portal/vouch/), the same login as the
    # Credential Manager. Only used when PORTAL_LOGIN_URL is set in portal.env.
    # CILogon returns the browser to /auth (vouch's callback_url); vouch then
    # sends it on to /auth/<state>/. Only these two shapes go to vouch, so the
    # portal's own pages (/auth/login, /auth/logout, /auth/fabric/...) are not affected.
    location = /auth {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $http_host;
    }
    location ~ ^/auth/[^/]+/$ {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $http_host;
    }
    # Start of the login. The portal adds ?url=<where to return afterwards>.
    location = /vouch/login {
        proxy_pass http://127.0.0.1:9090/login;
        proxy_set_header Host $http_host;
    }
    # End the FABRIC sign-in (clears the login cookie), then back to the portal
    location = /vouch/logout {
        proxy_pass http://127.0.0.1:9090/logout;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
