# FABRIC Service Gateway — HTTPS on the public IPv4 (FABNetv4Ext).
# Only the portal's IP (GATEWAY_ALLOWED_SOURCES) gets past Nginx; gateway.py
# checks the IP again plus the shared secret.
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     PLACEHOLDER_CRT;
    ssl_certificate_key PLACEHOLDER_KEY;

    # allow <portal IP>; deny all;  — written by deploy.sh / restart.sh
    include /etc/nginx/fabric-gateway-allow.conf;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        # Overwrite (not append) so callers cannot spoof their source IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
